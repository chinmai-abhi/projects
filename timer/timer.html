<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Timer</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>⏱ Stopwatch</h1>

        <div id="timer">
            00:00:00
        </div>

        <div class="buttons">

            <button id="start" type="button">
                Start
            </button>

            <button id="stop" type="button">
                Stop
            </button>

            <button id="reset" type="reset">
                Reset
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
